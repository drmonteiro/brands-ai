name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  tests:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    uses: ./.github/workflows/tests.yml

  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs: tests
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_COAST_0F9176703 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/frontend" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
        env:
          NEXT_PUBLIC_API_URL: "https://lanca-ai-backend-api.azurewebsites.net"
          NEXTAUTH_URL: "https://ambitious-coast-0f9176703.1.azurestaticapps.net"
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          EXTERNAL_AGENT_USERNAME: ${{ secrets.EXTERNAL_AGENT_USERNAME }}
          EXTERNAL_AGENT_PASSWORD: ${{ secrets.EXTERNAL_AGENT_PASSWORD }}
          EXTERNAL_AGENT_NAME: "UK Agent"
          EXTERNAL_AGENT_REGION: "UK"

  # A separate job so a settings problem can't block a frontend deploy.
  sync_app_settings:
    if: github.event_name == 'push'
    needs: build_and_deploy_job
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set BACKEND_JWT_SECRET on the Static Web App
        env:
          BACKEND_JWT_SECRET: ${{ secrets.BACKEND_JWT_SECRET }}
          APP_HOST: ambitious-coast-0f9176703.1.azurestaticapps.net
          API_VERSION: "2023-01-01"
        run: |
          set -euo pipefail
          if [ -z "$BACKEND_JWT_SECRET" ]; then
            echo "BACKEND_JWT_SECRET is not set in GitHub, nothing to sync."
            exit 0
          fi
          ID=$(az staticwebapp list --query "[?defaultHostname=='$APP_HOST'] | [0].id" -o tsv)
          if [ -z "$ID" ]; then
            echo "::error::No Static Web App found for $APP_HOST with these credentials."
            exit 1
          fi
          # Read and merge, so the other settings (such as NEXTAUTH_SECRET) are kept.
          az rest --method post --url "https://management.azure.com$ID/listAppSettings?api-version=$API_VERSION" -o json > current.json
          if [ "$(jq -r '.properties.BACKEND_JWT_SECRET // empty' current.json)" = "$BACKEND_JWT_SECRET" ]; then
            echo "Already up to date."
          else
            jq --arg value "$BACKEND_JWT_SECRET" '{properties: (.properties + {BACKEND_JWT_SECRET: $value})}' current.json > merged.json
            az rest --method put --url "https://management.azure.com$ID/config/appsettings?api-version=$API_VERSION" --body @merged.json -o none
            echo "Updated."
          fi
          echo "Setting names:"
          az rest --method post --url "https://management.azure.com$ID/listAppSettings?api-version=$API_VERSION" -o json | jq -r '.properties | keys[]'
          rm -f current.json merged.json

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_COAST_0F9176703 }}
          action: "close"
