# Build and push lanca-crawl4ai (Playwright + Chromium) to Azure Container Registry.
#
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   AZURE_CREDENTIALS   — JSON do service principal (igual ao workflow do backend).
#   ACR_NAME            — nome curto do registo, ex. "lancaacr" (não o FQDN).
#
# IAM: o mesmo service principal precisa de "AcrPush" (ou AcrDelete + Reader) no ACR:
#   az role assignment create --assignee <appId> --role AcrPush --scope /subscriptions/.../resourceGroups/.../providers/Microsoft.ContainerRegistry/registries/<ACR_NAME>
#
# Depois do push, no Web App / Container a que aponta o Crawl4AI, define a imagem:
#   <ACR_NAME>.azurecr.io/lanca-crawl4ai:0.8.5-chromium
# (ou :latest)

name: Build and push Crawl4AI image to ACR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'crawl4ai/**'
      - '.github/workflows/crawl4ai-acr.yml'

env:
  IMAGE_NAME: lanca-crawl4ai
  IMAGE_TAG: 0.8.5-chromium

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build, tag, and push
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          set -euo pipefail
          REGISTRY="${ACR_NAME}.azurecr.io"
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          docker build \
            -t "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${REGISTRY}/${IMAGE_NAME}:latest" \
            -t "${REGISTRY}/${IMAGE_NAME}:${SHORT_SHA}" \
            ./crawl4ai
          docker push "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${REGISTRY}/${IMAGE_NAME}:latest"
          docker push "${REGISTRY}/${IMAGE_NAME}:${SHORT_SHA}"

      - name: Image digest
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          REGISTRY="${ACR_NAME}.azurecr.io"
          echo "Pushed: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "        ${REGISTRY}/${IMAGE_NAME}:latest"
          echo "        ${REGISTRY}/${IMAGE_NAME}:$(echo '${{ github.sha }}' | cut -c1-7)"
