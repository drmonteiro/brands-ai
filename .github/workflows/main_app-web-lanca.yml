name: Build and deploy Backend to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_app-web-lanca.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: lanca-backend-api
  WEBAPP_NAME: lanca-ai-backend-api
  RESOURCE_GROUP: lanca-ai-rg

jobs:
  sync-env-vars:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Sync Application Settings to Azure
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          app-settings-json: |
            [
              {"name": "AZURE_OPENAI_API_KEY",            "value": "${{ secrets.AZURE_OPENAI_API_KEY }}",            "slotSetting": false},
              {"name": "AZURE_OPENAI_ENDPOINT",           "value": "${{ secrets.AZURE_OPENAI_ENDPOINT }}",           "slotSetting": false},
              {"name": "AZURE_OPENAI_DEPLOYMENT",         "value": "${{ secrets.AZURE_OPENAI_DEPLOYMENT }}",         "slotSetting": false},
              {"name": "AZURE_OPENAI_DEPLOYMENT_FAST",    "value": "${{ secrets.AZURE_OPENAI_DEPLOYMENT_FAST }}",    "slotSetting": false},
              {"name": "AZURE_OPENAI_EXTRACTION_DEPLOYMENT","value": "${{ secrets.AZURE_OPENAI_DEPLOYMENT_FAST }}",   "slotSetting": false},
              {"name": "AZURE_OPENAI_API_VERSION",        "value": "${{ secrets.AZURE_OPENAI_API_VERSION }}",        "slotSetting": false},
              {"name": "AZURE_OPENAI_EMBEDDING_DEPLOYMENT","value": "${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}","slotSetting": false},
              {"name": "RESEND_API_KEY",                  "value": "${{ secrets.RESEND_API_KEY }}",                  "slotSetting": false},
              {"name": "JINA_API_KEY",                    "value": "${{ secrets.JINA_API_KEY }}",                    "slotSetting": false},
              {"name": "EXA_API_KEY",                     "value": "${{ secrets.EXA_API_KEY }}",                     "slotSetting": false},
              {"name": "GOOGLE_PLACES_API_KEY",           "value": "${{ secrets.GOOGLE_PLACES_API_KEY }}",           "slotSetting": false},
              {"name": "POSTGRES_USER",                   "value": "${{ secrets.POSTGRES_USER }}",                   "slotSetting": false},
              {"name": "POSTGRES_PASSWORD",               "value": "${{ secrets.POSTGRES_PASSWORD }}",               "slotSetting": false},
              {"name": "POSTGRES_DB",                     "value": "${{ secrets.POSTGRES_DB }}",                     "slotSetting": false},
              {"name": "POSTGRES_HOST",                   "value": "${{ secrets.POSTGRES_HOST }}",                   "slotSetting": false},
              {"name": "POSTGRES_PORT",                   "value": "${{ secrets.POSTGRES_PORT }}",                   "slotSetting": false},
              {"name": "SYNC_DATABASE_URL",               "value": "${{ secrets.SYNC_DATABASE_URL }}",               "slotSetting": false},
              {"name": "FROM_EMAIL",                      "value": "${{ secrets.FROM_EMAIL }}",                      "slotSetting": false},
              {"name": "LANGCHAIN_TRACING_V2",            "value": "false",                                          "slotSetting": false},
              {"name": "CORS_ORIGINS",                    "value": "https://ambitious-coast-0f9176703.1.azurestaticapps.net", "slotSetting": false},
              {"name": "WEBSITES_PORT",                   "value": "8000",                                           "slotSetting": false},
              {"name": "PORT",                            "value": "8000",                                           "slotSetting": false},
              {"name": "WEBSITES_CONTAINER_START_TIME_LIMIT", "value": "1800",                                       "slotSetting": false}
            ]

  deploy:
    runs-on: ubuntu-latest
    needs: sync-env-vars
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push Docker image
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          set -euo pipefail
          REGISTRY="${ACR_NAME}.azurecr.io"
          IMAGE="${REGISTRY}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" -t "${REGISTRY}/${{ env.IMAGE_NAME }}:latest" ./backend
          docker push "$IMAGE"
          docker push "${REGISTRY}/${{ env.IMAGE_NAME }}:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Configure Web App to use container
        uses: azure/cli@v2
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        with:
          inlineScript: |
            set -euo pipefail
            REGISTRY="${ACR_NAME}.azurecr.io"
            IMAGE="${REGISTRY}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            ACR_USER=$(az acr credential show --name "$ACR_NAME" --query username -o tsv)
            ACR_PASS=$(az acr credential show --name "$ACR_NAME" --query passwords[0].value -o tsv)
            az webapp config container set \
              --name ${{ env.WEBAPP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --container-image-name "$IMAGE" \
              --container-registry-url "https://$REGISTRY" \
              --container-registry-user "$ACR_USER" \
              --container-registry-password "$ACR_PASS"
            az webapp config appsettings set \
              --name ${{ env.WEBAPP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --settings WEBSITES_PORT=8000 PORT=8000
            az webapp restart \
              --name ${{ env.WEBAPP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }}
            echo "Deployed $IMAGE"
