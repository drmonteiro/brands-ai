version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lanca-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=lanca
      - POSTGRES_PASSWORD=lanca_password
      - POSTGRES_DB=lanca_leads
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanca -d lanca_leads"]
      interval: 5s
      timeout: 5s
      retries: 5

  crawl4ai:
    build:
      context: ./crawl4ai
      dockerfile: Dockerfile
    image: lanca-crawl4ai:0.8.5-chromium
    container_name: crawl4ai
    ports:
      - "11235:11235"
    shm_size: 1gb
    mem_limit: 2g
    mem_reservation: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lanca-api
    depends_on:
      db:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - USE_CRAWL4AI=True
      - CRAWL4AI_BASE_URL=http://crawl4ai:11235
    restart: always


volumes:
  postgres_data:
